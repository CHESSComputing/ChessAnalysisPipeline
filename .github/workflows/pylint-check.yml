name: pylint

on: push

jobs:
  pylint:
    runs-on: ubuntu-latest

    container:
      image: python:3.11

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Run pylint on CHAP
      run: pylint --rcfile=.pylintrc CHAP
