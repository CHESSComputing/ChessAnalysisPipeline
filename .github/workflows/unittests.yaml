name: unittests

on:
  - push
  - pull_request

jobs:
  unittests:
    runs-on: ubuntu-latest

    container:
      image: python:3.11

    steps:
    - uses: actions/checkout@v4

    # Maybe faster than using container: image: python:3.11?
    # - uses: actions/setup-python@v5
    #   with:
    #     python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        sed -i "s/PACKAGE_VERSION/0.0.0/" setup.py
        pip install -e .
        pip install -r CHAP/test/requirements.txt

    - name: Run CHAP unittests
      run: python -m unittest CHAP.test

    - name: Run CHAP pytests
      run: pytest CHAP/test/ --ignore=CHAP/test/saxswaxs/server/
