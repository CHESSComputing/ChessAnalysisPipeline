name: Manually run tests with Pytest

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Update configuration with version (tag) name
      run: |
        sed -i "s/PACKAGE_VERSION/0.0.1/" setup.py
        sed -i "s/PACKAGE_VERSION/0.0.1/" CHAP/__init__.py
        cat setup.py

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
#        cache: 'pip'

#    - name: Setup Miniconda
#      uses: conda-incubator/setup-miniconda@v3
#      with:
#        python-version: '3.10'
#        environment-file: docs/environment.yml
#        auto-activate: true
#        activate-environment: sphinx
#        conda-remove-defaults: true
#        use-mamba: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install pytest-cov
        pip install pytest-html

    - name: Install package
      run: |
        pip install -e .
        conda list

    - name: Test with Pytest
      run: |
        pytest tests --html=report.html --self-contained-html --cov=tests --cov-report=html
#        pytest tests --junitxml=junit/test-results.xml --cov=tests --cov-report=xml --cov-report=html
