name: unittests

on:
  - push
  - pull_request

jobs:
  unittests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.14.8"]

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' 
          cache-dependency-path: 'requirements-${{ matrix.python-version }}.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i "s/PACKAGE_VERSION/0.0.0/" setup.py
          pip install -e .
          pip install -r CHAP/test/requirements-${{ matrix.python-version }}.txt

      - name: Run CHAP unittests
        run: python -m unittest CHAP.test

      - name: Run CHAP pytests
        run: pytest CHAP/test/ --ignore=CHAP/test/saxswaxs/server/
