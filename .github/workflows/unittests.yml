name: unittests

on:
  - push
  - pull_request

jobs:
  unittests:
    name: Run ${{ matrix.env-name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            env-file: "CHAP/test/environment-3.11.yaml"
            env-name: "env-3.11"
          - python-version: "3.14.8"
            env-file: "CHAP/test/environment-3.14.8.yaml"
            env-name: "env-3.14.8"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Conda Environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: ${{ matrix.env-file }}
        activate-environment: ${{ matrix.env-name }}
        show-channel-urls: true
        mamba-version: "*"
        use-mamba: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        sed -i "s/PACKAGE_VERSION/0.0.0/" setup.py
        pip install -e .

    - name: Run CHAP unittests
      run: python -m unittest CHAP.test

    - name: Run CHAP pytests
      run: pytest CHAP/test/ --ignore=CHAP/test/saxswaxs/server/
